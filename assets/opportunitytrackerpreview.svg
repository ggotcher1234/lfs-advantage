    <text x="723" y="307" fill="#9C7A1E" font-size="13" font-weight="700" text-anchor="middle">63</text>
    <text x="840" y="306" fill="rgba(26,26,26,0.75)" font-size="13.5">James Wu, Dir. Eng</text>
