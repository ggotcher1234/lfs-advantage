    <text x="723" y="91" fill="#3E8A5E" font-size="13" font-weight="700" text-anchor="middle">92</text>
    <text x="840" y="90" fill="rgba(26,26,26,0.75)" font-size="13.5">Sarah Chen, VP Ops</text>
    <text x="1040" y="90" fill="rgba(26,26,26,0.75)" font-size="13.5">Contacted</text>

