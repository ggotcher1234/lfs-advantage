    <text x="32" y="450" fill="#1A1A1A" font-size="14.5" font-weight="600">Continental Alloy Works</text>
    <text x="360" y="450" fill="rgba(26,26,26,0.65)" font-size="13.5">Hiring surge: 12 plant roles posted</text>
