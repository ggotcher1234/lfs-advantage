<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Opportunity Tracker table preview">
  <rect width="1200" height="480" fill="#FDFCFA"/>
  <rect x="0.5" y="0.5" width="1199" height="479" fill="none" stroke="rgba(0,0,0,0.1)"/>
  <g font-family="Barlow, Arial, sans-serif">
    <rect x="0" y="0" width="1200" height="48" fill="#F4F1EC"/>
