    <text x="723" y="379" fill="#3E8A5E" font-size="13" font-weight="700" text-anchor="middle">85</text>
    <text x="840" y="378" fill="rgba(26,26,26,0.75)" font-size="13.5">Angela Ruiz, VP Ops</text>
    <text x="1040" y="378" fill="rgba(26,26,26,0.75)" font-size="13.5">Contacted</text>

